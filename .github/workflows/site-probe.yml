name: Read essola.ru

on:
  push:
    branches: [claude/awesome-mccarthy-dlbgor]
    paths: ['server/site-probe/**', '.github/workflows/site-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node server/site-probe/probe.mjs
