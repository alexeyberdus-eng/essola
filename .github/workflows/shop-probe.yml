name: Shop page probe

on:
  push:
    branches: [claude/awesome-mccarthy-dlbgor]
    paths: ['server/shop-probe/**', '.github/workflows/shop-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        working-directory: server/shop-probe
        run: |
          true
          node probe.mjs
