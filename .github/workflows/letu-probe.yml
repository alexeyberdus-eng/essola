name: Letual API probe

on:
  push:
    branches: [claude/awesome-mccarthy-dlbgor]
    paths: ['server/letu-probe/**', '.github/workflows/letu-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: server/letu-probe
        run: |
          npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node probe.mjs
