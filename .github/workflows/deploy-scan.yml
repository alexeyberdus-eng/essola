name: Deploy AI scan function (Yandex Cloud)

on:
  push:
    branches: [claude/awesome-mccarthy-dlbgor]
    paths: ['server/yandex-scan/**', '.github/workflows/deploy-scan.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_API_KEY: ${{ secrets.YC_API_KEY }}
      VLM_MODEL: ${{ secrets.YC_VLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Yandex secrets are set
        if: env.YC_SA_KEY == '' || env.YC_FOLDER_ID == '' || env.YC_API_KEY == ''
        run: echo "Add YC_SA_KEY, YC_FOLDER_ID and YC_API_KEY to GitHub Secrets to deploy." && exit 0
      - name: Install yc CLI
        if: env.YC_SA_KEY != '' && env.YC_FOLDER_ID != '' && env.YC_API_KEY != ''
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - name: Deploy function
        if: env.YC_SA_KEY != '' && env.YC_FOLDER_ID != '' && env.YC_API_KEY != ''
        run: |
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/sa.json" && yc config set service-account-key "$RUNNER_TEMP/sa.json"
          yc config set folder-id "$YC_FOLDER_ID"
          yc serverless function get --name essola-scan >/dev/null 2>&1 || yc serverless function create --name essola-scan
          yc serverless function allow-unauthenticated-invoke essola-scan || echo "::warning::Make the function public in the console (needs admin role)"
          APP_KEY=$(printf '%s' "$YC_API_KEY" | sha256sum | cut -c1-40)
          (cd server/yandex-scan && zip -q ../../scan.zip index.js)
          ENVV="YC_API_KEY=$YC_API_KEY,YC_FOLDER_ID=$YC_FOLDER_ID,APP_KEY=$APP_KEY"
          [ -n "$VLM_MODEL" ] && ENVV="$ENVV,VLM_MODEL=$VLM_MODEL"
          yc serverless function version create --function-name essola-scan --runtime nodejs18 --entrypoint index.handler \
            --memory 256m --execution-timeout 30s --source-path scan.zip --environment "$ENVV" >/dev/null
          ID=$(yc serverless function get --name essola-scan --format json | jq -r .id)
          echo "Function URL: https://functions.yandexcloud.net/$ID"
