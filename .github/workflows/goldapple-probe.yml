# One-off, low-volume check of what Gold Apple publishes for crawlers: robots.txt,
# sitemaps and the structured data on a couple of product pages (price, barcode, INCI).
name: Gold Apple data probe

on:
  push:
    branches: [claude/awesome-mccarthy-dlbgor]
    paths: ['.github/workflows/goldapple-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (compatible; EssolaBot/0.1; +https://github.com/alexeyberdus-eng/essola)'
    steps:
      - name: robots.txt
        run: |
          curl -sS -m 20 -A "$UA" -D /tmp/h -o /tmp/robots.txt https://goldapple.ru/robots.txt || true
          head -5 /tmp/h; echo; head -c 4000 /tmp/robots.txt; echo

      - name: Sitemaps
        run: |
          SITEMAPS=$(grep -i '^sitemap:' /tmp/robots.txt | awk '{print $2}' | tr -d '\r' | head -5)
          [ -z "$SITEMAPS" ] && SITEMAPS=https://goldapple.ru/sitemap.xml
          echo "$SITEMAPS"
          for s in $SITEMAPS; do
            echo "== $s"
            curl -sS -m 30 -A "$UA" --compressed -o /tmp/sm "$s" -w "HTTP %{http_code}, %{size_download} bytes\n" || true
            (file /tmp/sm; head -c 1500 /tmp/sm | tr '>' '>\n' | head -40) || true
            sleep 2
          done

      - name: robots.txt header (rules for all bots)
        run: sed -n '1,40p' /tmp/robots.txt

      - name: Product sitemap and pages
        run: |
          for n in 1 5; do
            curl -sS -m 60 -A "$UA" --compressed -o /tmp/sm$n "https://goldapple.ru/sitemap-$n.xml" -w "sitemap-$n: HTTP %{http_code}, %{size_download} bytes\n" || true
            echo "urls: $(grep -c '<loc>' /tmp/sm$n)"; grep -oE '<loc>[^<]+' /tmp/sm$n | sed 's/<loc>//' | head -4
            sleep 2
          done
          cat /tmp/sm1 /tmp/sm5 | grep -oE '<loc>https://goldapple\.ru/[0-9]{6,}[^<]*' | sed 's/<loc>//' | head -2 > /tmp/products
          echo "product urls:"; cat /tmp/products
          for u in $(cat /tmp/products); do
            echo "================ $u"
            curl -sS -m 30 -A "$UA" --compressed -o /tmp/p.html "$u" -w "HTTP %{http_code}, %{size_download} bytes\n" || true
            echo "-- title:"; grep -oE '<title>[^<]{0,200}' /tmp/p.html | head -1
            echo "-- JSON-LD:"; grep -oE 'application/ld\+json"?[^>]*>[^<]{0,1200}' /tmp/p.html | head -2
            echo "-- gtin/barcode:"; grep -oiE '"(gtin13|gtin|ean|barcode)"[^,]{0,40}' /tmp/p.html | head -3
            echo "-- price:"; grep -oiE '"(price|actualPrice|amount)"[^,]{0,40}' /tmp/p.html | head -5
            echo "-- composition:"; grep -oiE '(состав|ingredients)[^<]{0,300}' /tmp/p.html | head -3
            echo "-- aqua:"; grep -oiE '.{0,80}aqua.{0,200}' /tmp/p.html | head -2
            sleep 3
          done
