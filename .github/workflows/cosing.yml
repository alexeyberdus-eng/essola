name: CosIng (EU cosmetic ingredients, © European Union)

# Official open data of the European Commission (reuse with attribution, Decision 2011/833/EU):
# the ingredient inventory with functions and the Annex II–VI lists (banned / restricted / colourants /
# preservatives / UV filters). Built into one lookup the scan function serves to the app.
on:
  push:
    paths: ['.github/workflows/cosing.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Where the full inventory is
        run: |
          UA='Mozilla/5.0 (compatible; EssolaBot/1.0; +https://essola.ru)'
          echo "== EC search API"
          curl -s -m 60 -A "$UA" -X POST "https://api.tech.ec.europa.eu/search-api/prod/rest/search?apiKey=285a77fd-1257-4271-8507-f0c6b2961203&text=*&pageSize=2&pageNumber=1" \
            -F 'query={"bool":{"must":[{"terms":{"itemType":["ingredient"]}}]}};type=application/json' | head -c 2500; echo
          echo "== data.europa.eu dataset"
          curl -s -m 60 -A "$UA" "https://data.europa.eu/api/hub/search/datasets/cosmetic-ingredient-database-ingredients-and-fragrance-inventory" | head -c 3000; echo
          curl -s -m 60 -A "$UA" "https://data.europa.eu/api/hub/search/search?q=cosing&filter=dataset&limit=5" | grep -o '"access_url":\[[^]]*\]\|"download_url":\[[^]]*\]\|"id":"[^"]*"' | head -30
