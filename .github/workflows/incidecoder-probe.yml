name: INCIDecoder probe (with INCIDecoder's permission)

on:
  push:
    paths: ['.github/workflows/incidecoder-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Site structure
        run: |
          UA='Mozilla/5.0 (compatible; EssolaBot/1.0; +https://essola.ru)'
          for u in https://incidecoder.com/robots.txt https://incidecoder.com/sitemap.xml https://incidecoder.com/sitemap_index.xml; do
            echo "=== $u"; curl -sL -m 20 -A "$UA" -w '\nHTTP %{http_code}\n' "$u" | head -c 3000; echo
          done
          echo "=== product list page"; curl -sL -m 20 -A "$UA" https://incidecoder.com/products/all | grep -oE 'href="/(products|brands)/[^"]+"' | sort -u | head -40
          echo "=== brands page"; curl -sL -m 20 -A "$UA" https://incidecoder.com/brands | grep -oE 'href="/brands/[^"]+"' | sort -u | wc -l
          echo "=== a product page"
          P=$(curl -sL -m 20 -A "$UA" https://incidecoder.com/products/all | grep -oE 'href="/products/[a-z0-9-]+"' | head -1 | cut -d'"' -f2)
          echo "page: $P"
          curl -sL -m 20 -A "$UA" "https://incidecoder.com$P" > p.html; wc -c p.html
          grep -oE 'id="[a-z0-9_-]+"' p.html | sort -u | head -40
          grep -oE '<script type="application/ld\+json">[^<]{0,1500}' p.html | head -3
          grep -o 'ingredlist[^>]*>' p.html | head -5
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf8',errors='ignore').read()
          i=h.find('showmore-section-ingredlist-short')
          print('ingredlist at', i)
          print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' | ',h[i:i+2500]))[:1500])
          for k in ['product-title','product-brand-title','product-main-image','og:image']:
              j=h.find(k); print(k, j, re.sub(r'\s+',' ',h[j:j+300]) if j>=0 else '')
          PY
