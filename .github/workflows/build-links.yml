# «Ссылки на сборки»: the latest Android builds in Expo with their status and download links, posted to the issue
# "📱 Essola в Expo Go". Useful when the build job stopped waiting but Expo finished the build later.
name: Ссылки на сборки

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Latest builds
        run: |
          npx --yes eas-cli@latest init --non-interactive --force > /dev/null
          npx --yes eas-cli@latest build:list --platform android --limit 4 --json --non-interactive > /tmp/builds.json
          node -e "
            const b=JSON.parse(require('fs').readFileSync('/tmp/builds.json','utf8'));
            const rows=b.map((x)=>'- '+(x.buildProfile||'')+' · '+(x.channel||'')+' · версия '+(x.appBuildVersion||'')+' · '+x.status+(x.artifacts&&x.artifacts.buildUrl?' · [скачать]('+x.artifacts.buildUrl+')':''));
            require('fs').writeFileSync('/tmp/body.md','## Последние сборки Android\n\n'+rows.join('\n')+'\n');
          "
          cat /tmp/body.md
      - name: Post
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('/tmp/body.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const issue = issues.find((i) => i.title === '📱 Essola в Expo Go' && !i.pull_request);
            if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            await core.summary.addRaw(body).write();
